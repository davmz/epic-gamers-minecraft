apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: minecraft

spec:
  type: LoadBalancer

  selector:
    app: minecraft

  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
      protocol: TCP
    - name: voicechat
      port: 24454
      targetPort: 24454
      protocol: UDP