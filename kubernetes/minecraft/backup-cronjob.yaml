apiVersion: batch/v1
kind: CronJob
metadata:
  name: minecraft-backup
  namespace: minecraft

spec:
  schedule: "0 5 * * 0"
  timeZone: "America/Winnipeg"

  concurrencyPolicy: Forbid

  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2

  jobTemplate:
    spec:
      backoffLimit: 1

      template:
        spec:
          restartPolicy: Never

          serviceAccountName: minecraft-backup

          containers:
            - name: backup
              image: alpine:3.20

              command:
                - /bin/sh
                - -c

              args:
                - |
                  set -e

                  WEEK=$(date +%V)

                  if [ $((10#$WEEK % 2)) -ne 0 ]; then
                    echo "Skipping backup - not a scheduled backup week."
                    exit 0
                  fi

                  echo "Installing backup tools..."

                  apk add --no-cache \
                    aws-cli \
                    tar \
                    gzip

                  TIMESTAMP=$(date +"%Y-%m-%d-%H%M%S")
                  BACKUP_NAME="minecraft-backup-${TIMESTAMP}.tar.gz"
                  BACKUP_PATH="/tmp/${BACKUP_NAME}"

                  echo "Creating backup: ${BACKUP_NAME}"

                  BACKUP_ITEMS="world mods config whitelist.json ops.json server.properties"

                  if [ -d /data/world_nether ]; then
                    BACKUP_ITEMS="${BACKUP_ITEMS} world_nether"
                  fi

                  if [ -d /data/world_the_end ]; then
                    BACKUP_ITEMS="${BACKUP_ITEMS} world_the_end"
                  fi

                  echo "Backing up:"
                  echo "${BACKUP_ITEMS}"

                  tar -czf "${BACKUP_PATH}" \
                    -C /data \
                    ${BACKUP_ITEMS}

                  echo "Uploading backup to S3..."

                  aws s3 cp \
                    "${BACKUP_PATH}" \
                    "s3://${BACKUP_BUCKET}/backups/${BACKUP_NAME}"

                  echo "Backup completed successfully."

              env:
                - name: BACKUP_BUCKET
                  value: "YOUR_BUCKET_NAME"

              volumeMounts:
                - name: minecraft-data
                  mountPath: /data
                  readOnly: true

          volumes:
            - name: minecraft-data
              persistentVolumeClaim:
                claimName: minecraft-data