name: Deploy Discord Bot

on:
  push:
    branches:
      - main
    paths:
      - "discord-bot/**"
      - ".github/workflows/discord-bot-deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: egm-prod-discord-bot
  EKS_CLUSTER: egm-prod
  K8S_NAMESPACE: discord-bot
  K8S_DEPLOYMENT: discord-bot
  K8S_CONTAINER: discord-bot

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Discord bot image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./discord-bot

      - name: Push Discord bot image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER

      - name: Deploy Discord bot
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image \
            deployment/$K8S_DEPLOYMENT \
            $K8S_CONTAINER=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --namespace $K8S_NAMESPACE

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/$K8S_DEPLOYMENT \
            --namespace $K8S_NAMESPACE \
            --timeout=5m