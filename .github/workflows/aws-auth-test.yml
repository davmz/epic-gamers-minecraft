name: AWS OIDC Auth Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-aws-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::740901968217:role/epic-gamers-minecraft-github-oidc-test
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity