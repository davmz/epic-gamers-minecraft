services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "1.21.11"

      MEMORY: "2G"

      ONLINE_MODE: "TRUE"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"

      MAX_PLAYERS: "7"
      DIFFICULTY: "normal"
      MODE: "survival"

      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "10"

      MOTD: "Local Test/Dev Modded Server"

    volumes:
      - ./data:/data

    restart: unless-stopped